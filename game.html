<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Water Drop Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="game-page">
    <main class="game-shell">
      <header class="hud">
        <h1>Water Drop</h1>
        <div class="stats">
          <span>Score: <strong id="score">0</strong></span>
          <span>Lives: <strong id="lives">5</strong></span>
        </div>
        <p id="feedback">Tap/click good drops. Avoid polluted drops.</p>
      </header>
      <canvas id="game-canvas" width="860" height="500" aria-label="Water Drop Game Area"></canvas>
      <div class="controls">
        <button id="restart" type="button">Restart</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
