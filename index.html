<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Water Drop Wireframe</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header>
        <h1>Water Drop (Wireframe)</h1>
        <p class="mission">Collect clean water drops, avoid pollutants.</p>
      </header>

      <section class="hud" aria-label="Game status">
        <div id="scoreStatus">Score: <span id="score">0</span></div>
        <div id="livesStatus">Lives: <span id="lives">3</span></div>
        <div id="speedStatus">Speed: <span id="speed">1.0x</span></div>
      </section>

      <section class="play-area-wrap">
        <canvas
          id="gameCanvas"
          width="420"
          height="600"
          tabindex="0"
          aria-label="Water drop game area"
          aria-describedby="controlsText scoreStatus livesStatus speedStatus feedback"
        >
          Water Drop game area. Move left and right to catch clean drops and avoid pollutant drops.
        </canvas>
      </section>

      <section class="controls">
        <button id="startBtn" type="button">Start / Restart</button>
        <div class="alt-controls" aria-label="Accessible movement controls">
          <button id="leftBtn" type="button">Move Left</button>
          <button id="rightBtn" type="button">Move Right</button>
        </div>
        <p id="controlsText">Use ← / → keys, Move Left/Move Right buttons, or tap/click/press left/right half to move.</p>
        <p id="feedback" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
